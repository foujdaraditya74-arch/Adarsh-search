<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adarsh Search</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#202124;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{padding:18px 24px;text-align:right}header a{color:#5f6368;text-decoration:none;font-size:14px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px 100px}
.logo{font-size:clamp(42px,12vw,72px);font-weight:600;letter-spacing:-3px;margin-bottom:28px;color:#4285f4}
.logo span:nth-child(2){color:#ea4335}.logo span:nth-child(3){color:#fbbc05}.logo span:nth-child(4){color:#4285f4}.logo span:nth-child(5){color:#34a853}.logo span:nth-child(6){color:#ea4335}
form{width:min(600px,100%)}.search{display:flex;align-items:center;border:1px solid #dfe1e5;border-radius:28px;padding:0 16px;height:52px;box-shadow:0 1px 6px #00000012}
.search:hover,.search:focus-within{box-shadow:0 1px 8px #00000030;border-color:transparent}
.search svg{width:20px;height:20px;fill:#9aa0a6;flex-shrink:0}
input{border:0;outline:0;flex:1;min-width:0;font-size:16px;padding:0 12px;background:transparent;color:#202124}
.buttons{display:flex;justify-content:center;gap:12px;margin-top:28px}.buttons button{background:#f8f9fa;border:1px solid #f8f9fa;border-radius:4px;padding:10px 16px;color:#3c4043;font-size:14px;cursor:pointer}.buttons button:hover{border-color:#dadce0;box-shadow:0 1px 1px #00000010}
.note{margin-top:26px;font-size:13px;color:#70757a;text-align:center;line-height:1.6}
footer{background:#f2f2f2;padding:15px 22px;color:#70757a;font-size:14px}
@media(max-width:480px){header{padding:14px}main{padding-bottom:70px}.buttons button{padding:10px 12px}}
</style>
</head>
<body>
<header><a href="https://www.google.com" target="_blank" rel="noopener">Google</a></header>
<main>
<div class="logo" aria-label="Adarsh Search"><span>A</span><span>d</span><span>a</span><span>r</span><span>s</span><span>h</span></div>
<form id="searchForm">
<div class="search">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 10-.71.71l.27.28v.78L20 21.49 21.49 20l-5.99-6zM10 14.5A4.5 4.5 0 1110 5.5a4.5 4.5 0 010 9z"/></svg>
<input id="q" name="q" type="search" placeholder="Search Google..." autocomplete="off" required>
</div>
<div class="buttons"><button type="submit">Search</button><button type="button" id="lucky">I'm Feeling Lucky</button></div>
</form>
<div class="note">Search the web with Google<br>Results open on Google Search.</div>
</main>
<footer>Adarsh Search · Powered by Google Search</footer>
<script>
const form=document.getElementById('searchForm'),q=document.getElementById('q');
function go(lucky=false){const query=q.value.trim();if(!query){q.focus();return}const url='https://www.google.com/search?q='+encodeURIComponent(query);location.href=lucky?'https://www.google.com/search?q='+encodeURIComponent(query)+'&btnI=1':url}
form.addEventListener('submit',e=>{e.preventDefault();go()});
document.getElementById('lucky').addEventListener('click',()=>go(true));
</script>
</body>
</html>
